# How to use 

1. Git clone https://github.com/vivek-patel-here/Masked_Unmasked_Face_recognition_using_Cosine_Similarity_and_adaptive_thresholding..git
2. pip install -r requirements.txt
3. python recognizer.py <makedImg>  <unmaskedImg>

Output : True <--- If Match
        False <--- Otherwise