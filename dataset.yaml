  Name : RMFRD
  Link : https://www.kaggle.com/datasets/muhammeddalkran/masked-facerecognition

  Name : SMFRD
  Link : https://www.kaggle.com/code/muhammeddalkran/masked-face-recognition-with-lfw-smfrd



